<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }
    .contact-container {
      width: 100%;
      padding: 20px;
    }
    .form-section {
      padding: 30px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      background: #fff;
    }
    /* Left Info */
    .left-info {
      flex: 1 1 300px;
      min-width: 250px;
    }
    /* Form Section */
    .form-section form {
      flex: 2 1 400px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }
    .form-section input, .form-section textarea {
      flex: 1 1 45%;
      padding: 12px;
      font-size: 14px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .form-section textarea {
      flex: 1 1 100%;
    }
    .form-section button {
      background-color: red;
      color: white;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
    }
    /* Google Maps */
    iframe {
      width: 100%;
      height: 400px;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="contact-container">
    <!-- Map -->
    <div style="width: 100%; height: 400px;">
      <iframe
        title="Tire Wholesale Location"
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2886.902373032774!2d-79.61181208450155!3d43.78476857911669!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x882b3e6eb0d45c4f%3A0x5b315bd939191da0!2s166%20Woodstream%20Blvd%2C%20Woodbridge%2C%20ON%20L4L%207Y2%2C%20Canada!5e0!3m2!1sen!2sca!4v1688573962784!5m2!1sen!2sca"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="no-referrer-when-downgrade">
      </iframe>
    </div>

    <!-- Contact Details & Form -->
    <div class="form-section">
      <!-- Left Info -->
      <div class="left-info">
        <h3>📍 166 WOODSTREAM BLV</h3>
        <p>WOODBRIDGE, ON. CANADA</p>
        <p><strong>📞 (416) 741-8555</strong><br>Mon to Fri 9am to 6 pm</p>
        <p><strong>📧 info@tirewholesale.ca</strong><br>Send us your query anytime!</p>
      </div>

      <!-- Contact Form -->
      <form>
        <input type="text" placeholder="Enter your name" required>
        <input type="email" placeholder="Enter email address" required>
        <input type="text" placeholder="Enter Subject" required>
        <textarea placeholder="Enter Message" rows="4" required></textarea>
        <button type="submit">SEND MESSAGE</button>
      </form>
    </div>
  </div>

</body>
</html>
